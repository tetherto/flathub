id: io.tether.QVAC.Workbench
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: qvac_workbench
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.ScreenSaver
  - --persist=.config/pear
  - --persist=.qvac
modules:
  - name: qvac_workbench-x64
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dm644 splash.png /app/bin/share/qvac_workbench/splash.png
      - install -Dm644 io.tether.QVAC.Workbench.metainfo.xml /app/share/metainfo/io.tether.QVAC.Workbench.metainfo.xml
      - install -Dm644 io.tether.QVAC.Workbench.png /app/share/icons/hicolor/512x512/apps/io.tether.QVAC.Workbench.png
      - install -Dm644 io.tether.QVAC.Workbench.desktop /app/share/applications/io.tether.QVAC.Workbench.desktop
      - cp qvac_workbench $FLATPAK_DEST/bin
    sources:
      - type: archive
        url: https://qvac.tether.dev/workbench-assets/flatpak-assets-1.0.0.tar.gz
        sha512: 1d88a9b8619175f7294c3a833124a6f707ba276f3bea6a62431dd5f3b067939080ee3b91d3c9e8f0c2e1e1bdb68e027f2cd133db57d73de6de592f396dd8b097
        strip-components: 0
