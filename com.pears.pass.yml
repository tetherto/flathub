id: com.pears.pass
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: pear-pass
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.ScreenSaver
  - --persist=.config/pear
modules:
  - name: pearpass-x64
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/app/bin
      env:
        npm_config_prefix: /app
      build-args:
        - --share=network
    build-commands:
      # Step 1: Build the appling (produces PearPass.AppDir)
      - npm install --global bare-build
      - cd appling && npm install
      - cd appling && bare-build --host=linux-x64 --icon lib/icons/linux/icon.png app.cjs
      # Step 2: Install AppDir contents (binary, libs, app data)
      - cp -a appling/PearPass.AppDir/usr/* $FLATPAK_DEST/
      # Step 3: Install Flatpak assets (metainfo, icon, desktop file)
      - install -Dm644 flatpak/com.pears.pass.metainfo.xml /app/share/metainfo/com.pears.pass.metainfo.xml
      - install -Dm644 flatpak/com.pears.pass.png /app/share/icons/hicolor/512x512/apps/com.pears.pass.png
      - install -Dm644 flatpak/com.pears.pass.desktop /app/share/applications/com.pears.pass.desktop
    sources:
      - type: git
        url: https://github.com/tetherto/pearpass-app-desktop.git
        tag: v1.3.0
        commit: 0c96cc95374d39093ef915ece6a3712ceb3a75ac
      - type: archive
        url: https://static.tether.dev/pearpass/flatpak-assets-1.0.0.tar.gz
        sha512: 05f04b50ee89661b996c7314e02cc12969c6a83ade0f5fe45b5a334425c3524b81033d27847eb26133aa1bfe076969b86838230f77cafb5d312047006b8d146b
        strip-components: 0
  - name: pearpass-arm64
    only-arches:
      - aarch64
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/app/bin
      env:
        npm_config_prefix: /app
      build-args:
        - --share=network
    build-commands:
      # Step 1: Build the appling (produces PearPass.AppDir)
      - npm install --global bare-build
      - cd appling && npm install
      - cd appling && bare-build --host=linux-arm64 --icon lib/icons/linux/icon.png app.cjs
      # Step 2: Install AppDir contents (binary, libs, app data)
      - cp -a appling/PearPass.AppDir/usr/* $FLATPAK_DEST/
      # Step 3: Install Flatpak assets (metainfo, icon, desktop file)
      - install -Dm644 flatpak/com.pears.pass.metainfo.xml /app/share/metainfo/com.pears.pass.metainfo.xml
      - install -Dm644 flatpak/com.pears.pass.png /app/share/icons/hicolor/512x512/apps/com.pears.pass.png
      - install -Dm644 flatpak/com.pears.pass.desktop /app/share/applications/com.pears.pass.desktop
    sources:
      - type: git
        url: https://github.com/tetherto/pearpass-app-desktop.git
        tag: v1.3.0
        commit: 0c96cc95374d39093ef915ece6a3712ceb3a75ac
      - type: archive
        url: https://static.tether.dev/pearpass/flatpak-assets-1.0.0.tar.gz
        sha512: 05f04b50ee89661b996c7314e02cc12969c6a83ade0f5fe45b5a334425c3524b81033d27847eb26133aa1bfe076969b86838230f77cafb5d312047006b8d146b
        strip-components: 0

