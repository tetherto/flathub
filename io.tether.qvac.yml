id: io.tether.qvac
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: run.sh
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --persist=.config/pear
  - --persist=.qvac
modules:
  - name: qvac_workbench-x64
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - cp -a main ${FLATPAK_DEST}/main
      - install -Dm755 run.sh ${FLATPAK_DEST}/bin/run.sh
      - install -Dm644 io.tether.qvac.metainfo.xml /app/share/metainfo/io.tether.qvac.metainfo.xml
      - install -Dm644 io.tether.qvac.png /app/share/icons/hicolor/512x512/apps/io.tether.qvac.png
      - install -Dm644 io.tether.qvac.desktop /app/share/applications/io.tether.qvac.desktop
    sources:
      - type: archive
        url: https://static.tether.dev/qv.ac/<VERSION>/QV.AC-x64-flatpak.tar.gz
        sha512: <sha512 from io.tether.qvac.source.yml>
        strip-components: 0
