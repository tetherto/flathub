# Flatpak manifest for PearPass Desktop Application
# A secure, decentralized and fully local password manager
#
# This manifest builds the application from source.
# Requires network access during build for npm and cmake-pear dependencies.
#
# Build with: flatpak-builder --allow-network --force-clean build-dir com.pear.pass.yml

id: com.pear.pass
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.llvm21
command: pearpass
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/llvm21/bin
  env:
    CC: clang
    CXX: clang++
    FLATPAK_BUILDER_DISABLE_APPSTREAM: "1"
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
modules:
  - name: pearpass-build-v2
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - echo "=== BUILD STARTING ==="
      - ls -la
      # Extract the source archive
      - tar -xzf pearpass-app-desktop-1.0.1.tar.gz
      - cd pearpass-app-desktop-1.0.1
      - ls -la
      # Check for appling directory
      - |
        cd pearpass-app-desktop-1.0.1
        if [ -d "appling" ]; then
          echo "Found appling directory"
          cd appling
          ls -la
          # Test network connectivity
          curl -I https://registry.npmjs.org/ || echo "Network test failed"
          # Install dependencies and build tools
          npm install --legacy-peer-deps
          npm install bare-make --no-save
          # Generate and build using bare-make
          npx bare-make generate --platform linux --arch arm64
          npx bare-make build || true  # Continue even if AppImage creation fails
          # Find and install the built binary directly
          if [ -f "build/pearpass" ]; then
            echo "Installing binary directly: build/pearpass"
            install -Dm755 build/pearpass /app/bin/pearpass
          else
            echo "Looking for pearpass binary in other locations"
            find . -name "pearpass" -type f -executable
            BINARY=$(find . -name "pearpass" -type f -executable | head -1)
            if [ -n "$BINARY" ]; then
              echo "Installing binary: $BINARY"
              install -Dm755 "$BINARY" /app/bin/pearpass
            else
              echo "No pearpass binary found"
              exit 1
            fi
          fi
        else
          echo "No appling directory found"
          exit 1
        fi
      # Install metadata files
      - install -Dm644 com.pear.pass.metainfo.xml /app/share/metainfo/com.pear.pass.metainfo.xml
      - install -Dm644 com.pear.pass.png /app/share/icons/hicolor/512x512/apps/com.pear.pass.png
      - install -Dm644 com.pear.pass.desktop /app/share/applications/com.pear.pass.desktop
      - echo "=== BUILD COMPLETE ==="
    sources:
      # Source code from GitHub repository
      - type: archive
        url: https://static.tether.dev/pearpass/flatpak-assets-1.0.0.tar.gz
        sha512: 05f04b50ee89661b996c7314e02cc12969c6a83ade0f5fe45b5a334425c3524b81033d27847eb26133aa1bfe076969b86838230f77cafb5d312047006b8d146b
        strip-components: 1
      # Application icon
      - type: file
        url: https://pass.pears.com/wp-content/uploads/downloads/pearpass-logo-512x512.png
        sha512: 08dcb60ad2671e1c3218c7fbd2323a9cf7a97a80ab460307bd1c85d91334b2052033d7ad8651ef4e88e0b31af59ffc002785ac76f0945108ef317a242f1bd040
        dest-filename: com.pear.pass.png
      # AppStream metainfo XML (from GitHub repository)
      - type: file
        url: https://raw.githubusercontent.com/tetherto/pearpass-app-desktop/4b0796a037602791a4363a7b96e3b8e4cd02ccb7/flatpak/com.pear.pass.metainfo.xml
        sha512: 6ff664d09325aa6257fcf6d252b68ed6193602c7d006a1f28e3d7a8a2150d3bcb88d86a61f23b8774838a5f553f59b338ac1cd7547645f21a76fe3bde7372922
      # Desktop entry file (from GitHub repository)
      - type: file
        url: https://raw.githubusercontent.com/tetherto/pearpass-app-desktop/4b0796a037602791a4363a7b96e3b8e4cd02ccb7/flatpak/com.pear.pass.desktop
        sha512: 52b684ce046fbd3ce41c975cf252f956ec82829fbe054fe8daf57ec46f4c33988ed36cabb4916d8ba921a3932b6e0c6342d17ff5166ce89b664edb9113ac3cda
